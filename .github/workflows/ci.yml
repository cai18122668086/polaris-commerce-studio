name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: polaris_ci
          POSTGRES_USER: polaris
          POSTGRES_PASSWORD: polaris_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polaris -d polaris_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      POLARIS_DATABASE_URL: postgresql+psycopg://polaris:polaris_ci_only@localhost:5432/polaris_ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "./backend[dev]"
      - run: python -m ruff check backend
      - run: python -m mypy --config-file backend/pyproject.toml backend/app
      - run: python -m alembic -c alembic.ini upgrade head
        working-directory: backend
      - run: python -m pytest backend

  contract:
    name: API contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: python -m pip install -e "./backend"
      - run: npm ci
      - run: npm run api:export
      - run: npm run api:generate
      - run: git diff --exit-code -- docs/openapi-v1.json lib/api/generated/openapi.d.ts

  containers:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
