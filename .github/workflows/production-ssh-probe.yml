name: Production SSH probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ssh-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, polaris-ci]
    timeout-minutes: 3
    steps:
      - name: Verify production SSH access
        env:
          POLARIS_DEPLOY_SSH_KEY: ${{ secrets.POLARIS_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${POLARIS_DEPLOY_SSH_KEY}"
          key_path="${RUNNER_TEMP}/polaris_deploy"
          trap 'rm -f "$key_path"' EXIT
          umask 077
          printf '%s\n' "${POLARIS_DEPLOY_SSH_KEY}" > "$key_path"
          ssh \
            -i "$key_path" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            ubuntu@43.129.198.147 \
            "echo SSH_OK && hostname && docker version --format '{{.Server.Version}}'"
