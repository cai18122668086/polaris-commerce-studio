name: polaris-commerce-studio

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: polaris
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: ${POLARIS_POSTGRES_PASSWORD:-polaris_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - polaris_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polaris -d polaris"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.6.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - polaris_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${POLARIS_MINIO_ROOT_USER:-polaris_minio}
      MINIO_ROOT_PASSWORD: ${POLARIS_MINIO_ROOT_PASSWORD:-polaris_minio_dev_only}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - polaris_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    environment: &backend-environment
      POLARIS_ENVIRONMENT: development
      POLARIS_AUTH_MODE: development
      POLARIS_DEVELOPMENT_USER_ID: usr_development
      POLARIS_DEVELOPMENT_WORKSPACE_ID: ws_development
      POLARIS_DEVELOPMENT_WORKSPACE_NAME: ${POLARIS_DEVELOPMENT_WORKSPACE_NAME:-开发工作区}
      POLARIS_DATABASE_URL: postgresql+psycopg://polaris:${POLARIS_POSTGRES_PASSWORD:-polaris_dev_only}@postgres:5432/polaris
      POLARIS_AUTO_CREATE_SCHEMA: "false"
      POLARIS_STORAGE_BACKEND: s3
      POLARIS_S3_ENDPOINT_URL: http://minio:9000
      POLARIS_S3_REGION: us-east-1
      POLARIS_S3_ACCESS_KEY: ${POLARIS_MINIO_ROOT_USER:-polaris_minio}
      POLARIS_S3_SECRET_KEY: ${POLARIS_MINIO_ROOT_PASSWORD:-polaris_minio_dev_only}
      POLARIS_S3_BUCKET: polaris-assets
      POLARIS_S3_AUTO_CREATE_BUCKET: "true"
      POLARIS_ACCESS_URL_SECRET: ${POLARIS_ACCESS_URL_SECRET:-development-access-url-secret-change-me}
      POLARIS_ASSET_ACCESS_URL_MODE: ${POLARIS_ASSET_ACCESS_URL_MODE:-same_origin}
      # Development may disable the durable quota ledger for unrestricted test
      # accounts. Production still requires quotas whenever a Provider is enabled.
      POLARIS_TASK_RUNNER: ${POLARIS_TASK_RUNNER:-mock}
      POLARIS_PROVIDER_QUOTA_ENABLED: ${POLARIS_PROVIDER_QUOTA_ENABLED:-false}
      # Internal beta records credits but never rejects jobs for balance exhaustion.
      POLARIS_WORKSPACE_CREDIT_ENFORCEMENT_ENABLED: ${POLARIS_WORKSPACE_CREDIT_ENFORCEMENT_ENABLED:-false}
      POLARIS_PRODUCT_IMAGE_PROVIDER_ENABLED: ${POLARIS_PRODUCT_IMAGE_PROVIDER_ENABLED:-false}
      POLARIS_REFERENCE_REMIX_PROVIDER_ENABLED: ${POLARIS_REFERENCE_REMIX_PROVIDER_ENABLED:-false}
      POLARIS_MODEL_POSE_TRANSFER_PROVIDER_ENABLED: ${POLARIS_MODEL_POSE_TRANSFER_PROVIDER_ENABLED:-false}
      POLARIS_CREATIVE_IMAGE_PROVIDER_ENABLED: ${POLARIS_CREATIVE_IMAGE_PROVIDER_ENABLED:-false}
      POLARIS_AMAZON_VISUAL_SUITE_PROVIDER_ENABLED: ${POLARIS_AMAZON_VISUAL_SUITE_PROVIDER_ENABLED:-false}
      POLARIS_CROSSBORDER_DETAIL_PROVIDER_ENABLED: ${POLARIS_CROSSBORDER_DETAIL_PROVIDER_ENABLED:-false}
      POLARIS_DOMESTIC_MAIN_IMAGE_PROVIDER_ENABLED: ${POLARIS_DOMESTIC_MAIN_IMAGE_PROVIDER_ENABLED:-false}
      POLARIS_DOMESTIC_MAIN_IMAGE_ASSET_CACHE_DIR: /var/lib/polaris/domestic-main-image-assets/sha256
      POLARIS_TENGLI_API_KEY: ${POLARIS_TENGLI_API_KEY:-}
      POLARIS_TENGLI_BASE_URL: ${POLARIS_TENGLI_BASE_URL:-https://api.tengliapi.xyz:8443}
      POLARIS_TENGLI_IMAGE_MODEL: ${POLARIS_TENGLI_IMAGE_MODEL:-gpt-image-2}
      POLARIS_TENGLI_VISION_MODEL: ${POLARIS_TENGLI_VISION_MODEL:-gpt-5.6-terra}
      # Keep a generous per-job runaway guard; recurring beta quotas use 0=unlimited.
      POLARIS_TENGLI_SMOKE_BUDGET_USD: ${POLARIS_TENGLI_SMOKE_BUDGET_USD:-200}
      POLARIS_TENGLI_DAILY_BUDGET_USD: ${POLARIS_TENGLI_DAILY_BUDGET_USD:-0}
      POLARIS_TENGLI_MONTHLY_BUDGET_USD: ${POLARIS_TENGLI_MONTHLY_BUDGET_USD:-0}
      POLARIS_TENGLI_DAILY_REQUEST_LIMIT: ${POLARIS_TENGLI_DAILY_REQUEST_LIMIT:-0}
      POLARIS_TENGLI_PLANNER_RESERVE_MICROS: ${POLARIS_TENGLI_PLANNER_RESERVE_MICROS:-250000}
      POLARIS_XINGHE_CONCURRENCY: ${POLARIS_XINGHE_CONCURRENCY:-2}
      POLARIS_XINGHE_MEDIUM_PRICE_MICROS: ${POLARIS_XINGHE_MEDIUM_PRICE_MICROS:-45000}
      POLARIS_XINGHE_HIGH_PRICE_MICROS: ${POLARIS_XINGHE_HIGH_PRICE_MICROS:-90000}
      POLARIS_XINGHE_SKILL_ROOT: ${POLARIS_XINGHE_SKILL_ROOT:-/app/skill_sources/xinghe-ecommerce-detail}
      POLARIS_AUTO_PROCESS_JOBS: "true"
      POLARIS_TASK_DISPATCHER: celery
      POLARIS_CELERY_BROKER_URL: redis://redis:6379/0
      POLARIS_CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    environment: *backend-environment
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - polaris_domestic_main_image_assets:/var/lib/polaris/domestic-main-image-assets
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    environment: *backend-environment
    command:
      - python
      - -m
      - celery
      - -A
      - app.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=2
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  dispatcher:
    build:
      context: ./backend
    environment: *backend-environment
    command: ["python", "-m", "app.outbox_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  polaris_postgres_data:
  polaris_redis_data:
  polaris_minio_data:
  polaris_domestic_main_image_assets:
